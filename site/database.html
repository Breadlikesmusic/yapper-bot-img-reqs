<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game data · Deepwoken Builder</title>
<meta name="description" content="Every talent, mantra, oath, boon, flaw, weapon and outfit in Deepwoken, with what they do.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap">
    <h1>Game data</h1>
    <p>Every talent, mantra, oath, boon, flaw, weapon and outfit.</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="database.html" class="on">Game data</a>
    </nav>
  </div>
</header>

<div class="wrap">

  <div class="row">
    <input type="search" id="q" placeholder="Search by name, or by what it does" autocomplete="off">
    <select id="kind">
      <option value="">All</option>
      <option value="talents">Talents</option>
      <option value="mantras">Mantras</option>
      <option value="oaths">Oaths</option>
      <option value="boons">Boons</option>
      <option value="flaws">Flaws</option>
      <option value="weapons">Weapons</option>
      <option value="outfits">Outfits</option>
    </select>
  </div>

  <p class="small muted" id="count">Loading</p>

  <table>
    <thead>
      <tr><th style="width:26%">Name</th><th style="width:18%">Type</th><th>What it does</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <footer>
    Data from the public Deepwoken builder API. Not affiliated with Deepwoken or its developers.
  </footer>

</div>

<script type="module">
import { boot, loadKind, searchRows, escapeHtml, formatStatBlock } from './app.js';

const KINDS = [
  { key: 'talents', label: 'Talents' },
  { key: 'mantras', label: 'Mantras' },
  { key: 'oaths', label: 'Oaths' },
  { key: 'boons', label: 'Boons' },
  { key: 'flaws', label: 'Flaws' },
  { key: 'weapons', label: 'Weapons' },
  { key: 'outfits', label: 'Outfits' },
];

const q = document.getElementById('q');
const kind = document.getElementById('kind');
const rows = document.getElementById('rows');
const count = document.getElementById('count');

await boot();

const all = new Map();
for (const k of KINDS) {
  all.set(k.key, await loadKind(k.key));
}

const labelOf = (row) => {
  if (row.rarity && row.rarity !== row.category) return `${row.category || row.rarity}`;
  return row.category || row.rarity || row.type || row.tier || '';
};

function draw() {
  const query = q.value.trim();
  const wanted = kind.value;

  const keys = wanted ? [wanted] : KINDS.map((k) => k.key);
  let out = [];

  for (const key of keys) {
    const list = all.get(key) || [];
    for (const row of searchRows(list, query)) {
      out.push({ ...row, _kind: key, _label: KINDS.find((k) => k.key === key).label });
    }
  }

  out.sort((a, b) => a.name.localeCompare(b.name));

  count.textContent = out.length + (out.length === 1 ? ' result' : ' results');

  rows.innerHTML = out
    .slice(0, 400)
    .map((row) => {
      const bits = [];
      if (row.description) bits.push(escapeHtml(row.description));
      if (row.details) bits.push('<span class="muted">' + escapeHtml(row.details) + '</span>');
      const needs = formatStatBlock(row.requires);
      const mantle = row.mantras ? `<div class="small muted">Mantras: ${escapeHtml(Object.values(row.mantras).flat().join(', '))}</div>` : '';
      return `<tr>
        <td><strong>${escapeHtml(row.name)}</strong></td>
        <td><span class="small">${escapeHtml(row._label)}</span>${labelOf(row) ? `<div class="small muted">${escapeHtml(labelOf(row))}</div>` : ''}</td>
        <td>${bits.join('<br>')}${needs ? '<div style="margin-top:6px">' + needs + '</div>' : ''}${mantle}</td>
      </tr>`;
    })
    .join('');

  if (out.length > 400) {
    count.textContent += ' (showing the first 400)';
  }
}

let timer;
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(draw, 120);
});
kind.addEventListener('change', draw);
draw();
</script>

</body>
</html>
